# Capped for a 16 GB PC that also runs the emulator (template default was -Xmx8G).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Flutter plugins live in the pub cache on C: while this project is on D:; Kotlin incremental
# compilation cannot cross drives on Windows ("Could not close incremental caches").
kotlin.incremental=false
