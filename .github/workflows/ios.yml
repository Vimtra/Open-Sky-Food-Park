# Builds the Open Sky iOS app (ios_app/) on a GitHub-hosted Mac (no Mac needed on our side),
# the same approach as github.com/MobAI-App/ios-builder.
#
# Output (Actions run → Artifacts):
#   OpenSky-ios-unsigned.ipa   iPhone build without a signature. Install with a re-signing tool
#                              (MobAI, Sideloadly, AltStore) and a free Apple ID, or sign it later.
#   OpenSky-ios-simulator.zip  Runner.app for the iOS Simulator (Appetize, MobAI simulator share).
#   screenshots/               the app on iPhone and iPad Simulators, also shown on the run's
#                              summary page and kept on the `ios-screenshots` branch.
#
# Signed builds for TestFlight and the App Store need a paid Apple Developer account;
# see ios_app/IOS.md. Owner of this file: Claude A (see COLLAB.md).

name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios_app/**"
      - "shared/seed/**"
      - "shared/img/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/ios-screenshots.sh"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only to publish screenshots to the ios-screenshots branch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0 # same as the Android build machine
          cache: true

      - name: Copy the shared menu and photos into the app
        run: node tool/sync-shared.mjs

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build for iPhone (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry OpenSky-ios-unsigned.ipa Payload && rm -rf Payload)
          ls -lh dist

      - name: Build for the iOS Simulator
        run: |
          flutter build ios --simulator --debug --build-number=${{ github.run_number }}
          (cd build/ios/iphonesimulator && zip -qry ../../../dist/OpenSky-ios-simulator.zip Runner.app)

      - name: Screenshots on iPhone and iPad Simulators
        run: bash ../.github/scripts/ios-screenshots.sh dist/screenshots

      - name: Publish screenshots (branch ios-screenshots + run summary)
        if: github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$PWD/dist/screenshots"
          ls "$src"/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          work="$(mktemp -d)"
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" ios-screenshots >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch ios-screenshots "$remote" "$work"
          else
            git init --quiet "$work" && git -C "$work" checkout --quiet -b ios-screenshots && git -C "$work" remote add origin "$remote"
          fi
          rm -f "$work"/*.png
          cp "$src"/*.png "$work"/
          {
            echo "# Open Sky iOS screenshots"
            echo
            echo "Build #${RUN} from commit ${SHA:0:7}. Generated by .github/workflows/ios.yml; do not edit."
            echo
            for f in "$work"/*.png; do n="$(basename "$f")"; echo "## ${n%.png}"; echo; echo "<img src=\"${n}\" width=\"320\">"; echo; done
          } > "$work/README.md"
          git -C "$work" add -A
          git -C "$work" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"             commit --quiet -m "Screenshots for build #${RUN} (${SHA:0:7})" || true
          git -C "$work" push --quiet origin ios-screenshots
          {
            echo "## Open Sky on the iOS Simulator (build #${RUN})"
            echo
            for f in "$src"/*.png; do n="$(basename "$f")"; echo "**${n%.png}**<br><img src=\"https://raw.githubusercontent.com/${REPO}/ios-screenshots/${n}?run=${RUN}\" width=\"300\">"; echo; done
            echo "All screenshots: https://github.com/${REPO}/tree/ios-screenshots"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSky-ios-${{ github.run_number }}
          path: ios_app/dist/
          retention-days: 14
